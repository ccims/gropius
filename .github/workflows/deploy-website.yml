name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      # Rendering the ~5,500 generated pages peaks at roughly 11 GB resident. That fits a standard
      # runner's 16 GB, but not with much to spare, and the default 4 GB swapfile is thin cover.
      - name: Enlarge the swapfile
        run: |
          sudo swapoff -a
          sudo fallocate -l 16G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: "**/package-lock.json"

      # Not released yet, so the backend cannot resolve it from a repository. Everything else the
      # backend needs comes from Maven Central or the Sonatype snapshot repository.
      - name: Install the Dokka GraphQL description plugin
        run: |
          git clone --depth 1 https://github.com/graphglue/dokka-graphql-description-plugin.git "$RUNNER_TEMP/dokka-graphql-description-plugin"
          cd "$RUNNER_TEMP/dokka-graphql-description-plugin"
          ./gradlew publishToMavenLocal --no-daemon

      - name: Install website dependencies
        run: npm ci
        working-directory: website
      - name: Install login-service dependencies
        run: npm ci
        working-directory: gropius-login-service/backend

      # Runs Dokka, boots both API modules and the login service to dump their schemas, and runs
      # TypeDoc - the same four stages `npm run generate` runs locally.
      - name: Generate the API references
        run: npm run generate
        working-directory: website

      - name: Build website
        run: npm run site
        working-directory: website

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: github.ref == 'refs/heads/main'
        with:
          deploy_key: ${{ secrets.ACTIONS_DEPLOY_KEY }}
          publish_dir: ./website/.vitepress/dist
          force_orphan: true
          external_repository: ccims/gropius-docs
          publish_branch: main
